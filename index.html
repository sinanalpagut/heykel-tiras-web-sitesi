<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#35322D" />
    <!--
      Sekme ikonu hiç bağlanmamıştı: tarayıcı /favicon.ico istiyor, SPA yeniden
      yazma kuralı HTML döndürüyor ve sekme ikonsuz kalıyordu. Üç biçim birden
      veriliyor — SVG modern tarayıcılar için, .ico eski istemciler ve doğrudan
      /favicon.ico isteği için, apple-touch-icon iOS ana ekranı için.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" sizes="any" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="Kese Benav — metal ve taş heykel arşivi. Karaköy döküm atölyesi, 2019—." />
    <!--
      Varsayılan: arama motorlarına KAPALI. Bu etiket statik olduğu için
      JavaScript çalıştırmayan botlar da görür — çalışma zamanında eklenen
      etiket onlara hiç ulaşmıyordu.

      Panelden (A6 → SEO → indekslensin) açılınca HomePage'deki effect bu
      etiketi "index, follow" ile EZER. Sıralama bilinçli: güvenli taraf
      varsayılan, izin açık bir karar.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <!--
      Sosyal paylaşım kartları. OG botları JavaScript ÇALIŞTIRMAZ; bu etiketler
      bu yüzden statik ve adresler MUTLAK. Alan adı değişirse (kendi domain'e
      geçişte) buradaki üç URL de güncellenmeli.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kese Benav" />
    <meta property="og:title" content="Kese Benav — Heykel, İstanbul" />
    <meta property="og:description" content="Metal ve taş heykel arşivi. Karaköy döküm atölyesi, 2019—." />
    <meta property="og:url" content="https://heykel-tiras-web-sitesi.web.app/" />
    <meta property="og:image" content="https://heykel-tiras-web-sitesi.web.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Yeşil patinalı bronz figür, kolları iki yana açık, koyu zemin önünde." />
    <meta property="og:locale" content="tr_TR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kese Benav — Heykel, İstanbul" />
    <meta name="twitter:description" content="Metal ve taş heykel arşivi. Karaköy döküm atölyesi, 2019—." />
    <meta name="twitter:image" content="https://heykel-tiras-web-sitesi.web.app/og.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>KESE BENAV — HEYKEL</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 40px; font-family: monospace; color: #eaeaea; background: #35322d">
        Bu arşiv JavaScript gerektirir. Eser listesi için ATOLYE@KESEBENAV.ART adresine yazın.
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
